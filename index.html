<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Melodia - Gerenciador de Prompts</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>
    <header>
        <div class="logo">
            <p>P</p>
            <h1>Prompts</h1>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Buscar...">
        </div>
    </header>
    
    <main>
        <nav class="sidebar">
            <ul class="menu">
                <li class="active"><a href="#" data-view="prompts">Prompts</a></li>
                <li><a href="#" data-view="estrutura">Estrutura</a></li>
                <li><a href="#" data-view="workspace">Workspace</a></li>
            </ul>
            
            <div class="sidebar-actions">
                <button class="action-btn nova-categoria-btn">+ Nova Categoria</button>
                <button class="action-btn importar-btn">⬆️ Importar Prompts</button>
                <button class="action-btn exportar-btn">⬇️ Exportar Prompts</button>
            </div>
        </nav>
        
        <div class="content">
            <div class="content-header">
                <h2 id="content-title">Categoria</h2>
                <div id="subcategorias-header" class="subcategorias-header">
                    <h3>Subcategorias</h3>
                </div>
            </div>
            
            <div id="content-area" class="content-area">
                <p class="empty-message">Selecione uma subcategoria</p>
            </div>
        </div>
    </main>
    
    <!-- Modal para adicionar/editar categoria -->
    <div id="modal-categoria" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Nova Categoria</h2>
            <form id="form-categoria">
                <div class="form-group">
                    <label for="categoria-nome">Nome da Categoria</label>
                    <input type="text" id="categoria-nome" required>
                </div>
                <div class="form-group">
                    <label for="categoria-secao">Seção</label>
                    <select id="categoria-secao">
                        <option value="musica">Música</option>
                        <option value="imagem">Imagem</option>
                        <option value="texto">Texto</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Salvar</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/views.js"></script>
    <script src="js/prompts.js"></script>
    <script src="js/workspace.js"></script>
    <script src="js/letras.js"></script>
    <script src="js/conversor.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
